<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>foostac</title>
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <h1>foostac</h1>
        <div class="controls">
          <select id="coverageSelect" aria-label="Coverage team selection">
            <option value="0">Coverage: Off</option>
            <option value="1">Coverage: Team 1</option>
            <option value="2">Coverage: Team 2</option>
          </select>
          <button id="toggleDraw" type="button" aria-pressed="false">Draw: Off</button>
          <button id="clearDrawings" type="button" aria-label="Clear drawing layer">Clear Drawing</button>
          <button id="resetBoard" type="button" aria-label="Reset bars, ball, and drawings">Reset</button>
        </div>
      </header>
      <section class="board-wrap">
        <div class="goal goal-left" aria-label="Linkes Tor"></div>
        <div id="board" class="board" aria-label="Foosball tactics board">
          <div class="board-field">
            <div class="markings">
              <div class="penalty-area penalty-area-left"></div>
              <div class="penalty-area penalty-area-right"></div>
              <div class="goal-area goal-area-left"></div>
              <div class="goal-area goal-area-right"></div>
              <div class="center-circle"></div>
              <div class="center-line"></div>
            </div>
            <canvas id="shadowLayer"></canvas>
            <canvas id="drawLayer"></canvas>
          </div>
          <!-- Team 1 (blue) -->
          <div class="bar" data-id="bar-1" data-team="1" style="left: 9%">
            <div class="rail"></div>
            <div class="players" data-count="1"></div>
            <div class="grip"></div>
          </div>
          <div class="bar" data-id="bar-3" data-team="1" style="left: 23%">
            <div class="rail"></div>
            <div class="players" data-count="2"></div>
            <div class="grip"></div>
          </div>
          <div class="bar" data-id="bar-5" data-team="1" style="left: 46%">
            <div class="rail"></div>
            <div class="players" data-count="5"></div>
            <div class="grip"></div>
          </div>
          <div class="bar" data-id="bar-7" data-team="1" style="left: 65%">
            <div class="rail"></div>
            <div class="players" data-count="3"></div>
            <div class="grip"></div>
          </div>
          <!-- Team 2 (red) -->
          <div class="bar" data-id="bar-2" data-team="2" style="left: 35%">
            <div class="rail"></div>
            <div class="players" data-count="3"></div>
            <div class="grip"></div>
          </div>
          <div class="bar" data-id="bar-4" data-team="2" style="left: 54%">
            <div class="rail"></div>
            <div class="players" data-count="5"></div>
            <div class="grip"></div>
          </div>
          <div class="bar" data-id="bar-6" data-team="2" style="left: 77%">
            <div class="rail"></div>
            <div class="players" data-count="2"></div>
            <div class="grip"></div>
          </div>
          <div class="bar" data-id="bar-8" data-team="2" style="left: 91%">
            <div class="rail"></div>
            <div class="players" data-count="1"></div>
            <div class="grip"></div>
          </div>
          <div id="ball" class="ball" aria-label="Ball"></div>
        </div>
        <div class="goal goal-right" aria-label="Rechtes Tor"></div>
      </section>
    </main>
    <script src="./src/script.js"></script>
  </body>
</html>
